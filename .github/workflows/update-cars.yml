name: Update car listings

on:
  schedule:
    - cron: '0 7 * * *'   # runs daily at 07:00 UTC (10:00 Bulgarian time)
  workflow_dispatch:        # also allows manual trigger from GitHub Actions tab

jobs:
  update:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip3 install requests playwright
          playwright install chromium

      - name: Run Korea update script
        run: python3 scripts/update_cars.py

      - name: Run China update script
        run: python3 scripts/update_china_cars.py

      - name: Commit and push if listings changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cars.json china-cars.json
          git diff --staged --quiet && echo "No changes." || (
            git commit -m "Auto-update car listings [skip ci]"
            git push
          )
